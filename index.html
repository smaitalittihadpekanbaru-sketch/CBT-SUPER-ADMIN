  --ink:#17202B; --ink-2:#39434E; --muted:#5A665F; --line:#D3DAD1; --line-2:#BCC6BA;
  --t1:#1D6B4C; --t1-soft:#E0ECE4; --t2:#2A5775; --t2-soft:#E2EAF0; --t3:#8A6212; --t3-soft:#F3EBD9;
  --ok:#2C6B46; --ok-soft:#E2EDE5; --warn:#8A5A10; --warn-soft:#F6EDDB; --danger:#A3302B; --danger-soft:#F7E6E4;
  --r:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A17; --surface:#1C2320; --surface-2:#232B27;
  --ink:#E6EBE6; --ink-2:#C6CFC8; --muted:#95A29A; --line:#2E3833; --line-2:#3C4842;
  --t1:#6FBF93; --t1-soft:#1B2F25; --t2:#79B2D4; --t2-soft:#182834; --t3:#D6AB55; --t3-soft:#302716;
  --ok:#78C197; --ok-soft:#1B2F25; --warn:#D9A95E; --warn-soft:#322715; --danger:#E3837C; --danger-soft:#3A1E1C;
}}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-fig);font-weight:700;letter-spacing:-.004em}
/* Angka rapor selalu sejajar kolom dan setinggi huruf besar. */
.grade b,.rapor .big b,.jen b,.sum b,.nval b,.unitk-s,.bb .vl,.tb b,.rp-tbl .r{font-variant-numeric:tabular-nums lining-nums}

.wrap{max-width:660px;margin:0 auto;padding:16px 16px 28px}
.head{display:flex;align-items:center;gap:11px;padding-bottom:13px;margin-bottom:14px;border-bottom:1px solid var(--line-2)}
.head h1{margin:0;font-size:19px}
.head p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.logo{flex:0 0 auto;display:block}

/* Kartu = satu lembar bergaris, bukan kotak melayang. */
.card{background:var(--surface);border:1px solid var(--line);border-radius:0;padding:14px 15px;margin-bottom:12px}
.card h2{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{margin:14px 0 6px;font-size:13px;color:var(--ink-2)}
.mini{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.pos{color:var(--ok)} .neg{color:var(--danger)}
.mt{margin-top:12px}
.grow{flex:1;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 14px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--t1);color:var(--t1)}
.btn.primary{background:var(--t1);border-color:var(--t1);color:#fff}
.btn.primary:hover{color:#fff;filter:brightness(.93)}
.btn.xs{min-height:30px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input{width:100%;min-height:42px;padding:9px 11px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:inherit}
.input:focus{outline:none;border-color:var(--t1);box-shadow:0 0 0 2px color-mix(in srgb,var(--t1) 30%,transparent)}
textarea.input{min-height:82px;resize:vertical}
label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:10px 0 5px}

/* Pemilih kelas & nama */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:8px}
.chip{display:grid;gap:3px;padding:13px 12px;text-align:left;border:1px solid var(--line);border-radius:0;
  background:var(--surface);font:inherit;color:inherit;cursor:pointer;box-shadow:inset 3px 0 0 var(--t1)}
.chip:hover{background:var(--surface-2)}
.chip b{font-family:var(--font-fig);font-size:16px}
.chip span{font-size:11.5px;color:var(--muted)}
.names{display:grid;gap:0;max-height:56vh;overflow:auto;border:1px solid var(--line)}
.nm{text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);
  color:inherit;font:inherit;font-weight:500;cursor:pointer}
.names .nm:last-child{border-bottom:0}
.nm:hover{background:var(--surface-2);color:var(--t1)}
.back{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}

.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:2px;font-size:11.5px;font-weight:600;
  background:var(--surface-2);color:var(--muted)}
.badge.b1{background:var(--t1-soft);color:var(--t1)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.tone{background:var(--t2-soft);color:var(--t2)}
.badge.grp{background:var(--t1-soft);color:var(--t1)}

/* Kepala murid: nama di kiri, satu angka besar di kanan. Itu yang dicari. */
.id{display:flex;align-items:center;gap:11px;box-shadow:inset 3px 0 0 var(--t1)}
.id b{font-size:16px;display:block;font-weight:600;line-height:1.25}
.av{flex:0 0 auto;width:40px;height:40px;border-radius:2px;display:grid;place-items:center;
  background:var(--t1);color:#fff;font-weight:700;font-size:15px}
.id .grade{display:flex;flex-direction:column;align-items:center;min-width:62px;padding:2px 8px;border-left:1px solid var(--line)}
.id .grade b{font-family:var(--font-fig);font-size:28px;line-height:1.05;color:var(--t1);font-weight:700}
.id .grade span{font-size:11px;font-weight:600;color:var(--muted)}

/* Tab: di ponsel jadi bilah bawah supaya kelima tab terjangkau ibu jari. */
.tabs{display:flex;gap:0;margin:0 0 12px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--surface)}
.tab{position:relative;display:flex;align-items:center;justify-content:center;gap:5px;flex:1 0 auto;min-height:40px;padding:8px 13px;
  border:0;border-bottom:2px solid transparent;background:transparent;font:inherit;font-size:13px;font-weight:500;
  color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--t1);border-bottom-color:var(--t1);font-weight:600}
.tab i{display:inline-flex;align-items:center;justify-content:center;font-style:normal;min-width:17px;height:17px;padding:0 4px;
  border-radius:2px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700}
.tab.on i{background:var(--t1);color:#fff}

/* Absen */
.abs-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;margin-top:10px}
.ab{min-height:50px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);
  font:inherit;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer}
.ab.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));color:var(--ok)}
.ab.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));color:var(--warn)}
.ab.danger{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));color:var(--danger)}
.ab.on{color:#fff}
.ab.ok.on{background:var(--ok);border-color:var(--ok)}
.ab.warn.on{background:var(--warn);border-color:var(--warn)}
.ab.danger.on{background:var(--danger);border-color:var(--danger)}
.ab:disabled{opacity:.6;cursor:progress}

.task{border:1px solid var(--line);border-radius:0;padding:12px 14px;margin-bottom:9px;background:var(--surface)}
.task .t{font-weight:600;font-size:14.5px}
.task .s{font-size:12px;color:var(--muted);margin-top:2px}

.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:0;border:1px solid var(--line)}
.sum>div{background:var(--surface-2);padding:8px 10px;border-right:1px solid var(--line)}
.sum>div:last-child{border-right:0}
.sum small{display:block;font-size:10.5px;color:var(--muted)}
.sum b{font-family:var(--font-fig);font-size:18px;font-weight:700}

.list{list-style:none;margin:0;padding:0;display:grid;gap:0;border:1px solid var(--line)}
.list li{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;background:var(--surface);border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list .t{font-weight:600;font-size:13.5px}
.list .s{font-size:11.5px;color:var(--muted)}

.hist{display:flex;flex-wrap:wrap;gap:4px}
.h{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 5px;border-radius:2px;font-size:11px;font-weight:700;
  background:var(--surface-2);color:var(--muted)}
.h.hadir{background:var(--ok-soft);color:var(--ok)}
.h.izin{background:var(--warn-soft);color:var(--warn)}
.h.sakit{background:var(--t3-soft);color:var(--t3)}
.h.alpa{background:var(--danger-soft);color:var(--danger)}
.h.x{background:var(--surface-2);color:var(--muted);font-weight:500;padding:0 7px}

.lk-chips{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0}
.lk-chip{display:inline-flex;align-items:center;gap:5px;max-width:230px;padding:4px 9px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--t1-soft);color:var(--t1);font-size:11.5px;font-weight:600;
  text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-chip:hover{border-color:var(--t1)}

.les{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:11px 12px;background:var(--surface);margin-bottom:0}
.les.soon{background:var(--surface-2);color:var(--muted)}
.les-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.les-h b{font-size:13.5px;font-weight:600}
.les-t{font-size:13px;font-weight:500;line-height:1.45}
.les-m{font-size:12px;color:var(--muted);line-height:1.5;margin-top:2px}

.note{font-size:12.5px;border-radius:0;padding:9px 11px;background:var(--surface-2);color:var(--ink-2);
  border-left:3px solid var(--line-2);margin-bottom:10px}
.note.ok{background:var(--ok-soft);color:var(--ok);border-left-color:var(--ok)}
.note.warn{background:var(--warn-soft);color:var(--warn);border-left-color:var(--warn)}
.note.err{background:var(--danger-soft);color:var(--danger);border-left-color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:22px 12px;border:1px dashed var(--line-2);border-radius:0;
  background:var(--surface-2);font-size:13px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;max-width:92vw;
  background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:6px;font-size:13.5px;font-weight:500;
  box-shadow:0 10px 30px rgba(20,26,23,.3)}
.toast.ok{background:var(--ok);color:#fff}
.toast.warn{background:var(--warn);color:#fff}
.toast.err{background:var(--danger);color:#fff}
footer{text-align:center;font-size:11.5px;color:var(--muted);margin-top:22px}

/* Nilai huruf */
.lt{display:inline-flex;align-items:center;justify-content:center;min-width:28px;padding:1px 6px;border-radius:2px;
  font-family:var(--font-fig);font-weight:700;font-size:12.5px;background:var(--t1-soft);color:var(--t1)}
.lt.LA{background:var(--ok-soft);color:var(--ok)}
.lt.LB{background:var(--t2-soft);color:var(--t2)}
.lt.LC{background:var(--t3-soft);color:var(--t3)}
.lt.LD{background:var(--warn-soft);color:var(--warn)}
.lt.LE,.lt.LF{background:var(--danger-soft);color:var(--danger)}

/* Rapor: satu angka besar, sisanya kecil dan bergaris. */
.rapor{display:flex;gap:0;flex-wrap:wrap;align-items:stretch;margin-top:8px;border:1px solid var(--line)}
.rapor .big{display:flex;align-items:center;gap:11px;padding:14px 18px;background:var(--t1-soft);
  box-shadow:inset 3px 0 0 var(--t1);flex:0 0 auto}
.rapor .big b{font-family:var(--font-fig);font-size:40px;font-weight:700;line-height:1;color:var(--t1)}
.rapor .big .lt{font-size:15px;min-width:38px;padding:4px 9px}
.rapor .side{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:0;flex:1 1 240px}
.rapor .side div{display:flex;flex-direction:column;padding:10px 12px;border-left:1px solid var(--line);justify-content:center}
.rapor .side small{font-size:11px;color:var(--muted)}
.rapor .side b{font-family:var(--font-fig);font-size:15px;font-weight:700}

.jenis{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:0;border:1px solid var(--line)}
.jen{display:flex;flex-direction:column;gap:2px;padding:9px 11px;border:0;border-right:1px solid var(--line);background:var(--surface)}
.jenis .jen:last-child{border-right:0}
.jen small{font-size:11px;color:var(--muted)}
.jen b{font-family:var(--font-fig);font-size:18px;font-weight:700;line-height:1.15}
.jen i{font-style:normal;font-size:10.5px;color:var(--muted)}
.jen .lt{align-self:flex-start}

.nilai{display:grid;gap:0;border:1px solid var(--line)}
.nrow{display:flex;align-items:center;gap:11px;padding:9px 11px;border:0;border-bottom:1px solid var(--line);background:var(--surface)}
.nilai .nrow:last-child{border-bottom:0}
.nrow .t{font-size:13px;font-weight:600}
.nrow .s{font-size:11.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nval{display:flex;align-items:center;gap:7px}
.nval b{font-family:var(--font-fig);font-size:17px;font-weight:700}
.nval i{font-style:normal;font-size:11px;color:var(--muted)}

.grp-box{margin-top:10px;padding:11px;border-radius:0;border:1px solid var(--line);background:var(--t1-soft)}
.grp-box>label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;margin-top:0}
.mem{display:flex;flex-wrap:wrap;gap:6px;max-height:206px;overflow:auto;padding:2px}
.memb{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:7px 12px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface);font-size:12.5px;cursor:pointer;margin:0;font-weight:400;color:var(--ink)}
.memb input{accent-color:var(--t1);width:16px;height:16px}
.memb.on{border-color:var(--t1);font-weight:600}
.tps{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}

/* Rekap: tabel, batang pembanding, tren */
.rp-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.rp-tbl th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:6px 7px;
  border-bottom:1px solid var(--line-2);white-space:nowrap}
.rp-tbl td{padding:7px;border-bottom:1px solid var(--line)}
.rp-tbl tr:last-child td{border-bottom:0}
.rp-tbl .r{text-align:right;white-space:nowrap}
.rp-tbl .hasil{background:var(--t1-soft)}
.rp-tbl .hasil td{font-weight:700;color:var(--t1)}
.bandbar{display:grid;gap:6px;margin-top:10px}
.bb{display:flex;align-items:center;gap:9px;font-size:12.5px}
.bb .nm2{flex:0 0 94px;color:var(--muted);font-size:11.5px}
.bb .tr{flex:1;height:7px;border-radius:0;background:var(--surface-3,var(--surface-2));overflow:hidden}
.bb .tr i{display:block;height:100%;background:var(--t1)}
.bb.kelas .tr i{background:color-mix(in srgb,var(--muted) 50%,transparent)}
.bb .vl{flex:0 0 40px;text-align:right;font-weight:700}
.tren{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:10px;padding:0 2px}
.tb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.tb .bar2{width:100%;max-width:32px;border-radius:0;background:var(--t1);min-height:3px}
.tb small{font-size:9.5px;color:var(--muted);white-space:nowrap}
.tb b{font-family:var(--font-fig);font-size:11.5px;font-weight:700}

.todo{display:grid;gap:0;border:1px solid var(--line)}
.td{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--surface);
  border-bottom:1px solid var(--line);border-left:3px solid var(--t1)}
.todo .td:last-child{border-bottom:0}
.td.late{border-left-color:var(--danger);background:var(--danger-soft)}
.td.soon{border-left-color:var(--warn);background:var(--warn-soft)}
.td .t{font-weight:600;font-size:13.5px}
.td .s{font-size:11.5px;color:var(--muted)}

.jd{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:0;background:var(--surface);
  border-bottom:1px solid var(--line);margin-bottom:0}
.jd .d{flex:0 0 60px;font-weight:700;font-size:12.5px}
.jd .w{font-size:12.5px;color:var(--muted)}
.jd.next{background:var(--t1-soft);color:var(--t1);box-shadow:inset 3px 0 0 var(--t1)}
.jd.next .w{color:var(--t1)}

.tp-list{display:grid;gap:0}
.tpr{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;background:var(--surface);border-bottom:1px solid var(--line)}
.tp-list .tpr:last-child{border-bottom:0}
.tpr .st{flex:0 0 auto;width:19px;height:19px;border-radius:2px;display:grid;place-items:center;font-size:11px;font-weight:700;
  background:var(--surface-2);color:var(--muted);margin-top:1px}
.tpr.ikut .st{background:var(--ok);color:#fff}
.tpr.ajar .st{background:var(--warn-soft);color:var(--warn)}
.tpr .k{font-weight:700;font-size:12px;color:var(--t1)}
.tpr .o{font-size:12.5px;line-height:1.45}
.tpr .u{font-size:11px;color:var(--muted)}

.lipat{margin-top:12px;border:1px solid var(--line);border-radius:0;background:var(--surface)}
.lipat>summary{cursor:pointer;padding:10px 12px;font-size:13px;font-weight:600;color:var(--ink-2);list-style:none}
.lipat>summary::-webkit-details-marker{display:none}
.lipat>summary::before{content:"\25B8  ";color:var(--muted)}
.lipat[open]>summary{border-bottom:1px solid var(--line)}
.lipat[open]>summary::before{content:"\25BE  "}
.lipat .tp-list{padding:0}

.unit-list{display:grid;gap:0;margin-top:8px;border:1px solid var(--line)}
.unitk{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:11px 12px;background:var(--surface)}
.unit-list .unitk:last-child{border-bottom:0}
.unitk-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
.unitk-h b{font-size:13.5px;font-weight:600}
.unitk-s{font-family:var(--font-fig);font-size:20px;font-weight:700;color:var(--t1)}
.kompi{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line)}
.kp{display:inline-flex;flex-direction:column;align-items:center;min-width:46px;padding:5px 8px;
  background:var(--surface-2);border:0;border-right:1px solid var(--line)}
.kompi .kp:last-child{border-right:0}
.kp i{font-style:normal;font-size:10px;font-weight:600;color:var(--muted)}
.kp b{font-family:var(--font-fig);font-size:14px;font-weight:700}
.unitk .u{font-size:11px;color:var(--muted);margin-top:6px}

@media(max-width:620px){
  .rapor{flex-direction:column}
  .rapor .big{width:100%;justify-content:center}
  /* Dua kolom pasti, bukan auto-fit: kalau auto-fit, sel terakhir
     membungkus sendirian dan menyisakan separuh baris kosong bergaris. */
  /* flex-basis 240px tadinya berlaku ke TINGGI begitu .rapor jadi kolom,
     sehingga tiap sel melar jadi dua ratus piksel untuk dua baris teks. */
  .rapor .side{grid-template-columns:repeat(2,1fr);flex:0 0 auto}
  .rapor .side div{border-left:0;border-top:1px solid var(--line)}
  .rapor .side div:nth-child(even){border-left:1px solid var(--line)}
  .sum{grid-template-columns:repeat(2,1fr)}
  .sum>div{border-right:0}
  .sum>div:nth-child(odd){border-right:1px solid var(--line)}
  .sum>div:nth-child(n+3){border-top:1px solid var(--line)}
  .jenis{grid-template-columns:repeat(2,1fr)}
  .jen{border-right:0}
  .jen:nth-child(odd){border-right:1px solid var(--line)}
  .jen:nth-child(n+3){border-top:1px solid var(--line)}
  .bb .nm2{flex:0 0 70px}
  /* Bilah tab pindah ke bawah: lima tab terjangkau ibu jari tanpa digeser. */
  .wrap{padding-bottom:70px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;margin:0;overflow:visible;
    border-top:1px solid var(--line-2);border-bottom:0;
    padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(20,26,23,.08)}
  .tab{flex:1 1 0;min-width:0;padding:9px 2px;font-size:11.5px;min-height:52px;
    border-bottom:0;border-top:2px solid transparent;flex-direction:column;gap:2px}
  .tab.on{border-bottom-color:transparent;border-top-color:var(--t1);background:var(--t1-soft)}
  .tab i{position:absolute;top:5px;right:calc(50% - 20px)}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <svg class="logo" width="40" height="40" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <rect width="64" height="64" rx="7" fill="#1D6B4C"/>
      <g fill="#fff">
        <rect x="12" y="19" width="22" height="4" opacity=".5"/>
        <rect x="12" y="30" width="22" height="4" opacity=".74"/>
        <rect x="12" y="41" width="22" height="4" opacity=".38"/>
      </g>
      <rect x="40" y="13" width="12" height="38" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
      <rect x="42.5" y="27" width="7" height="10" fill="#fff"/>
    </svg>
    <div><h1>Rekap Belajarku</h1>
      <p>SMAIT Al-Ittihad — absen, tugas, nilai, dan materi dalam satu halaman</p></div>
  </div>
  <div id="body"><div class="empty">Memuat…</div></div>
  <footer>My Productivity Hub — portal siswa</footer>
</div>

<script>
/* ===== URL Web App Apps Script milik guru ===== */
const API = 'https://script.google.com/macros/s/AKfycbyV8s3_yYClutUiPfF7Jam_Tww6QFJkoZKABIFBEvEV_jdR6fRASdixXHGxjj043WDsJw/exec';

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const pad = (n) => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const parseISO = (s) => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const fmtFull = (s) => { const d = parseISO(s); return d ? `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}` : '—'; };
const fmtShort = (s) => { const d = parseISO(s); return d ? `${d.getDate()}/${d.getMonth() + 1}` : '—'; };
const fmtDate = (s) => { const d = parseISO(s); return d ? `${d.getDate()} ${BULAN[d.getMonth()].slice(0, 3)} ${d.getFullYear()}` : '—'; };
const fmtBulan = (s) => { const m = String(s || '').match(/^(\d{4})-(\d{2})$/); return m ? `${BULAN[+m[2] - 1].slice(0, 3)} ${m[1].slice(2)}` : '—'; };
const selisihHari = (a, b) => { const x = parseISO(a), y = parseISO(b); return (x && y) ? Math.round((y - x) / 86400000) : null; };
const num = (v) => (v === '' || v == null || isNaN(Number(v)) ? null : Number(v));
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
};

function toast(msg, kind = '', ms = 4500) {
  const old = $('.toast'); if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

/** Permintaan ke Apps Script. Content-Type text/plain agar tidak kena preflight CORS. */
async function call(action, payload = {}, tries = 3) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const ctrl = new AbortController();
      const to = setTimeout(() => ctrl.abort(), 30000);
      const res = await fetch(API, {
        method: 'POST', signal: ctrl.signal,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action }, payload))
      });
      clearTimeout(to);
      const j = await res.json();
      if (!j.ok) { const err = new Error(j.error || 'Permintaan gagal.'); err.final = true; throw err; }
      return j;
    } catch (e) {
      lastErr = e;
      // server sudah menjawab tegas (nama tidak terdaftar, tautan salah, dll):
      // mengulanginya hanya memperlambat dan bisa menggandakan data
      if (e && e.final) break;
      if (i < tries - 1) await new Promise((r) => setTimeout(r, 700 * (i + 1)));
    }
  }
  throw lastErr;
}

const ABSEN = [['Hadir', 'ok'], ['Izin', 'warn'], ['Sakit', 'warn'], ['Alpa', 'danger']];
const S = { cls: '', name: '', q: '', classes: [], names: [], tasks: [], recap: null };
const S_TAB = { cur: 'ringkas', pick: {}, mapel: 0 };

async function boot() {
  const p = new URLSearchParams(location.search);
  try {
    const j = await call('studentClasses');
    S.classes = j.classes || [];
  } catch (e) { $('#body').innerHTML = `<div class="note err">Gagal memuat: ${esc(e.message)}</div>`; return; }
  const tab = String(p.get('tab') || '').toLowerCase();
  if (['ringkas', 'absen', 'tugas', 'nilai', 'belajar'].indexOf(tab) >= 0) S_TAB.cur = tab;
  const want = p.get('kelas') || store.get('kelas');
  const nm = p.get('nama') || store.get('nama');
  if (want && S.classes.some((c) => c.className === want)) return openClass(want, nm);
  pickClass();
}

function pickClass() {
  S.cls = ''; S.name = '';
  $('#body').innerHTML = `<div class="card"><h2>Pilih kelasmu</h2>
    <p class="mini">Daftar kelas disiapkan oleh gurumu.</p>
    ${S.classes.length ? `<div class="grid mt">${S.classes.map((c) => `<button class="chip" data-cls="${esc(c.className)}">
        <b>${esc(c.className)}</b><span>${c.students || 0} siswa${c.tasks ? ` · ${c.tasks} tugas` : ''}</span></button>`).join('')}</div>`
      : '<div class="empty">Belum ada kelas yang dibuka gurumu.</div>'}</div>`;
}

async function openClass(cls, preName) {
  S.cls = cls; store.set('kelas', cls);
  $('#body').innerHTML = '<div class="empty">Memuat daftar nama…</div>';
  try {
    const j = await call('studentRoster', { className: cls });
    S.names = j.names || [];
  } catch (e) { $('#body').innerHTML = `<div class="note err">Gagal memuat: ${esc(e.message)}</div>`; return; }
  if (preName && S.names.some((n) => n.toLowerCase() === String(preName).toLowerCase())) return openName(preName);
  pickName('');
}

function pickName(q) {
  S.q = String(q || '').toLowerCase();
  const names = S.q ? S.names.filter((n) => n.toLowerCase().includes(S.q)) : S.names;
  $('#body').innerHTML = `<div class="card">
    <div class="back"><button class="btn xs" data-back="cls">← Ganti kelas</button><span class="badge b1">${esc(S.cls)}</span></div>
    <h2>Pilih namamu</h2>
    <p class="mini">Nama diambil dari daftar kelas yang dibuat guru. Kalau namamu tidak ada, beri tahu gurumu.</p>
    <input class="input mt" id="q" placeholder="Ketik untuk mencari namamu…" value="${esc(S.q)}" autocomplete="off">
    <div class="mt">${names.length ? `<div class="names">${names.map((n) => `<button class="nm" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>`
      : `<div class="empty">${S.names.length ? 'Nama tidak ditemukan. Coba ketik sebagian namamu saja.' : 'Daftar nama kelas ini masih kosong.'}</div>`}</div>
    <p class="mini mt">${S.names.length} nama terdaftar di kelas ${esc(S.cls)}.</p></div>`;
  const inp = $('#q');
  let t;
  inp.oninput = () => { clearTimeout(t); t = setTimeout(() => pickName(inp.value), 180); };
  if (S.q) { inp.focus(); inp.setSelectionRange(S.q.length, S.q.length); }
}

async function openName(name) {
  S.name = name; store.set('nama', name);
  $('#body').innerHTML = '<div class="empty">Memuat rekapmu…</div>';
  await reload();
}

async function reload() {
  try {
    const [t, r] = await Promise.all([
      call('studentOpenTasks', { className: S.cls }),
      call('studentRecap', { className: S.cls, studentName: S.name })
    ]);
    S.tasks = t.tasks || [];
    S.recap = r;
  } catch (e) { $('#body').innerHTML = `<div class="note err">Gagal memuat: ${esc(e.message)}</div>`; return; }
  home();
}

/* ----------------------------- bantu ------------------------------- */

function letterOf(n, sc) {
  if (n == null || n === '' || isNaN(Number(n))) return '';
  const list = (sc || []).slice().sort((a, b) => b.min - a.min);
  const v = Number(n);
  for (let i = 0; i < list.length; i++) if (v >= list[i].min) return list[i].l;
  return '';
}
function lclass(l) { return 'L' + String(l || '').replace(/[^A-Za-z]/g, ''); }
/* Skala huruf ledger: 16 tingkat, sama persis dengan rumus di berkas guru. */
const GRADE_LLC = [['A+', 95], ['A', 90], ['A-', 85], ['B+', 80], ['B', 75], ['B-', 70], ['C+', 65],
  ['C', 60], ['C-', 55], ['D+', 50], ['D', 45], ['D-', 40], ['E+', 35], ['E', 30], ['E-', 25], ['F', 0]];
function gradeLLC(n) {
  const v = Number(n);
  if (!isFinite(v)) return '';
  for (let i = 0; i < GRADE_LLC.length; i++) if (v >= GRADE_LLC[i][1]) return GRADE_LLC[i][0];
  return 'F';
}
function inisial(nm) {
  return String(nm || '').trim().split(/\s+/).slice(0, 2).map((x) => x[0] || '').join('').toUpperCase() || '?';
}
/** Ledger mapel yang sedang dilihat (kalau siswa punya lebih dari satu mapel). */
function rpAktif() {
  const list = (S.recap && S.recap.ledger) || [];
  if (!list.length) return null;
  return list[Math.min(S_TAB.mapel, list.length - 1)] || list[0];
}
const KOMP_SINGKAT = { Reading: 'RD', Listening: 'LS', Writing: 'WR', Speaking: 'SP', Grammar: 'GR', 'Daily Test': 'DT' };
const KOMP_URUT = ['Reading', 'Listening', 'Writing', 'Speaking', 'Grammar', 'Daily Test'];
function hitungAbsen(absen) {
  const c = { Hadir: 0, Izin: 0, Sakit: 0, Alpa: 0 };
  (absen || []).forEach((a) => { if (c[a.status] != null) c[a.status]++; });
  return c;
}
/** Tugas yang masih harus dikerjakan, sudah diurut dari yang paling mendesak. */
function tugasBelum(r) {
  const sudah = {};
  (r.tugas || []).forEach((x) => { if (x.submitted) sudah[x.id] = 1; });
  return (S.tasks || []).filter((t) => !sudah[t.id])
    .map((t) => Object.assign({}, t, { sisa: t.dueDate ? selisihHari(todayISO(), t.dueDate) : null }))
    .sort((a, b) => {
      const sa = a.sisa === null ? 9999 : a.sisa, sb = b.sisa === null ? 9999 : b.sisa;
      return sa - sb;
    });
}
/** Hari jadwal berikutnya dari hari ini, dipakai untuk menandai baris jadwal.
 *  Server mengirim dayNo 1–7 (Senin–Minggu); nama hari dipakai sebagai cadangan. */
function jadwalBerikut(jadwal) {
  if (!(jadwal || []).length) return -1;
  const hariIni = new Date().getDay();            // 0 = Minggu
  const idx = (j) => {
    const n = Number(j.dayNo);
    if (isFinite(n) && n >= 1 && n <= 7) return n === 7 ? 0 : n;
    const s = String(j.day || '').trim().toLowerCase();
    const id = HARI.findIndex((h) => h.toLowerCase() === s);
    if (id >= 0) return id;
    return ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'].indexOf(s);
  };
  let best = -1, bestJarak = 99;
  jadwal.forEach((j, i) => {
    const d = idx(j);
    if (d < 0) return;
    const jarak = (d - hariIni + 7) % 7;
    if (jarak < bestJarak) { bestJarak = jarak; best = i; }
  });
  return best;
}

/* ---------------------------- kerangka ----------------------------- */

function home() {
  const r = S.recap || { ringkas: {}, absen: [], tugas: [], nilai: [], rapor: {}, ledger: [] };
  const belum = tugasBelum(r).length;
  const rp = rpAktif();
  const flat = r.rapor || {};
  const nilaiUtama = rp && rp.nilai !== '' ? rp.nilai : flat.rata;
  const hurufUtama = rp && rp.huruf ? rp.huruf : (flat.huruf || '');
  /* Label dipendekkan supaya kelimanya muat berdampingan di bilah bawah
     pada layar 360px; isi panelnya sendiri sudah menjelaskan selebihnya. */
  const tabs = [['ringkas', 'Ringkas', ''], ['absen', 'Absen', ''], ['tugas', 'Tugas', belum ? String(belum) : ''],
    ['nilai', 'Nilai', ''], ['belajar', 'Materi', '']];
  $('#body').innerHTML = `
    <div class="card id">
      <div class="av">${esc(inisial(S.name))}</div>
      <div class="grow"><b>${esc(S.name)}</b><span class="mini">Kelas ${esc(S.cls)}${rp && rp.subject ? ' · ' + esc(rp.subject) : ''}</span></div>
      ${nilaiUtama != null && nilaiUtama !== '' ? `<div class="grade"><b>${esc(String(nilaiUtama))}</b><span>${esc(hurufUtama || '')}</span></div>` : ''}
      <button class="btn xs" data-back="1">Ganti</button>
    </div>
    <div class="tabs">${tabs.map(([k, l, b]) => `<button class="tab ${S_TAB.cur === k ? 'on' : ''}" data-tab="${k}">${l}${b ? `<i>${b}</i>` : ''}</button>`).join('')}</div>
    <div id="pane">${pane(r)}</div>`;
}

function pane(r) {
  return S_TAB.cur === 'tugas' ? paneTugas(r)
    : S_TAB.cur === 'nilai' ? paneNilai(r)
      : S_TAB.cur === 'belajar' ? paneBelajar(r)
        : S_TAB.cur === 'absen' ? paneAbsen(r) : paneRingkas(r);
}

/* --- 1. RINGKASAN --------------------------------------------------- */

function paneRingkas(r) {
  const rk = r.ringkas || {};
  const rp = rpAktif();
  const tp = r.tp || { diikuti: [], semua: [] };
  const belum = tugasBelum(r);
  const mendesak = belum.filter((t) => t.sisa !== null && t.sisa <= 3);
  const today = todayISO();
  const absHariIni = (r.absen || []).filter((a) => a.date === today)[0] || null;
  const jadwal = r.jadwal || [];
  const nextJ = jadwalBerikut(jadwal);

  return `
    ${absHariIni ? '' : `<div class="note warn">Kamu <b>belum absen hari ini</b> (${fmtFull(today)}). Buka tab <b>Absen</b>.</div>`}
    ${mendesak.length ? `<div class="note err"><b>${mendesak.length} tugas</b> harus dikumpulkan dalam 3 hari ke depan.</div>` : ''}

    <div class="card"><h2>Rekap belajarku</h2>
      <p class="mini">Angka di bawah dihitung dari catatan gurumu — absen, tugas, dan nilai yang sudah masuk.</p>
      <div class="sum mt">
        <div><small>Kehadiran</small><b>${rk.persen == null ? '—' : rk.persen + '%'}</b></div>
        <div><small>Tugas terkumpul</small><b>${rk.dikumpulkan || 0}<span class="mini">/${rk.tugas || 0}</span></b></div>
        <div><small>Butir nilai</small><b>${(r.nilai || []).length}</b></div>
        <div><small>TP diikuti</small><b>${(tp.diikuti || []).length}<span class="mini">/${(tp.semua || []).length}</span></b></div>
      </div>
    </div>

    ${rp ? kartuRapor(rp, r, true) : `<div class="card"><h2>Nilai</h2>
      <div class="empty">Belum bisa dihitung — guru belum memasukkan nilai unit, Mid Test, atau Final Test untuk kelas ini.</div></div>`}

    <div class="card"><h2>Yang perlu kamu kerjakan <span class="badge ${belum.length ? 'danger' : 'ok'}">${belum.length}</span></h2>
      ${belum.length ? `<div class="todo">${belum.slice(0, 6).map((t) => {
        const kls = t.sisa === null ? '' : (t.sisa < 0 ? 'late' : (t.sisa <= 3 ? 'soon' : ''));
        const ket = t.sisa === null ? 'tanpa batas waktu'
          : t.sisa < 0 ? `lewat ${-t.sisa} hari` : (t.sisa === 0 ? 'hari ini' : `${t.sisa} hari lagi`);
        return `<div class="td ${kls}"><div class="grow"><div class="t">${esc(t.title)}${String(t.mode || '') === 'kelompok' ? ' <span class="badge grp">kelompok</span>' : ''}</div>
          <div class="s">${esc([t.subject, t.type].filter(Boolean).join(' · '))}${t.dueDate ? ` · batas ${fmtDate(t.dueDate)} — ${ket}` : ` · ${ket}`}</div></div></div>`;
      }).join('')}</div>
      ${belum.length > 6 ? `<p class="mini mt">dan ${belum.length - 6} tugas lain — lihat tab Tugas.</p>` : ''}`
      : '<div class="empty">Tidak ada tugas yang menunggu. Kerja bagus.</div>'}
    </div>

    ${(r.tren || []).length > 1 ? `<div class="card"><h2>Perkembangan nilaiku</h2>
      <p class="mini">Rata-rata seluruh nilai per bulan, pada skala 100.</p>
      <div class="tren">${r.tren.slice(-8).map((b) => `<div class="tb">
        <b>${b.rata}</b><div class="bar2" style="height:${Math.max(4, Math.round(Number(b.rata) * 0.6))}px"></div>
        <small>${fmtBulan(b.bulan)}</small></div>`).join('')}</div></div>` : ''}

    ${jadwal.length ? `<div class="card"><h2>Jadwal pelajaran</h2>
      ${jadwal.map((j, i) => `<div class="jd ${i === nextJ ? 'next' : ''}">
        <div class="d">${esc(j.day || '—')}</div>
        <div class="grow"><div class="w">${esc([j.start && j.end ? j.start + '–' + j.end : (j.start || ''), j.subject, j.room].filter(Boolean).join(' · ') || '—')}</div></div>
        ${i === nextJ ? '<span class="badge b1">berikutnya</span>' : ''}</div>`).join('')}
    </div>` : ''}`;
}

/** Kartu ledger — dipakai di Ringkasan (ringkas) dan di tab Nilai (lengkap). */
function kartuRapor(rp, r, ringkas) {
  const list = (r.ledger || []);
  const kl = rp.kelas || {};
  const lebar = (v) => Math.max(0, Math.min(100, Math.round((num(v) || 0))));
  const ang = (v) => (v === '' || v == null ? '—' : esc(String(v)));
  const unitAda = (rp.unit || []).filter((u) => u.score !== '' || Object.keys(u.komp || {}).length);
  return `
    <div class="card"><h2>Nilai${rp.subject ? ' — ' + esc(rp.subject) : ''}
        ${rp.semester ? `<span class="badge tone">${esc(rp.semester)}</span>` : ''}
        ${rp.tahun ? `<span class="badge">${esc(rp.tahun)}</span>` : ''}</h2>
      ${list.length > 1 && !ringkas ? `<div class="tps mt">${list.map((x, i) => `<button class="btn xs ${i === S_TAB.mapel ? 'primary' : ''}" data-mapel="${i}">${esc(x.subject || 'Mapel ' + (i + 1))}</button>`).join('')}</div>` : ''}
      <div class="rapor">
        <div class="big"><b>${rp.nilai === '' ? '—' : esc(String(rp.nilai))}</b><span class="lt ${lclass(rp.huruf)}">${esc(rp.huruf || '—')}</span></div>
        <div class="side">
          <div><small>GPA</small><b>${ang(rp.gpa)}<span class="mini"> / 4,0</span></b></div>
          <div><small>KKM</small><b>${ang(rp.kkm)}</b></div>
          <div><small>Status</small><b class="${rp.tuntas ? 'pos' : rp.tuntas === false ? 'neg' : ''}">${esc(rp.ket || '—')}</b></div>
          ${kl.peringkat ? `<div><small>Peringkat</small><b>${kl.peringkat} <span class="mini">dari ${kl.n}</span></b></div>` : ''}
        </div>
      </div>
      <p class="mini mt">REPORT SCORE = rata-rata nilai tiap unit, Mid Test, dan Final Test, ditambah Persentatges × 10%. GPA = REPORT SCORE ÷ 25.</p>
      ${ringkas ? '' : `
      ${unitAda.length ? `<h3>Nilai tiap unit</h3>
        <div class="unit-list">${unitAda.map((u) => `<div class="unitk">
          <div class="unitk-h"><b>Unit ${u.no}</b>
            <span class="unitk-s">${u.score === '' ? '—' : esc(String(u.score))}</span></div>
          <div class="kompi">${KOMP_URUT.filter((c) => (u.komp || {})[c] !== undefined).map((c) => `<span class="kp" title="${esc(c)}">
            <i>${esc(KOMP_SINGKAT[c])}</i><b>${esc(String(u.komp[c]))}</b></span>`).join('')}</div>
          ${(u.komp || {})['Daily Test'] !== undefined && KOMP_URUT.some((c) => c !== 'Daily Test' && u.komp[c] !== undefined)
            ? '<div class="u">Daily Test × 50% + rata lima komponen × 50%</div>' : ''}
        </div>`).join('')}</div>`
        : '<div class="empty mt">Nilai unit belum ada.</div>'}
      <h3>Penilaian lain</h3>
      <div class="sum">
        <div><small>Mid Test</small><b>${ang(rp.mid)}</b></div>
        <div><small>Final Test</small><b>${ang(rp.final)}</b></div>
        <div><small>Star Points</small><b>${rp.star === '' ? '—' : esc(String(rp.star))}<span class="mini">/${esc(String(rp.starMax || 600))}</span></b></div>
        <div><small>Persentatges</small><b>${rp.persen === '' ? '—' : esc(String(rp.persen)) + '%'}</b></div>
      </div>
      ${kl.n ? `<h3>Dibanding kelas</h3>
        <div class="bandbar">
          <div class="bb"><span class="nm2">Nilaiku</span><span class="tr"><i style="width:${lebar(rp.nilai)}%"></i></span><span class="vl">${ang(rp.nilai)}</span></div>
          <div class="bb kelas"><span class="nm2">Rata kelas</span><span class="tr"><i style="width:${lebar(kl.rata)}%"></i></span><span class="vl">${ang(kl.rata)}</span></div>
          <div class="bb kelas"><span class="nm2">Tertinggi</span><span class="tr"><i style="width:${lebar(kl.tertinggi)}%"></i></span><span class="vl">${ang(kl.tertinggi)}</span></div>
        </div>
        <p class="mini mt">${kl.tuntas} dari ${kl.n} siswa sudah mencapai KKM ${esc(String(rp.kkm))}.
          ${rp.wali ? `Wali kelas: ${esc(rp.wali)}.` : ''}</p>` : ''}
      <p class="mini mt">Ini hasil hitungan berjalan dari nilai yang sudah masuk, bukan rapor resmi sekolah.</p>`}
    </div>`;
}

/* --- 2. ABSEN ------------------------------------------------------- */

function paneAbsen(r) {
  const rk = r.ringkas || {};
  const today = todayISO();
  const ab = (r.absen || []).filter((a) => a.date === today)[0] || null;
  const c = hitungAbsen(r.absen);
  const tp = r.tp || { diikuti: [], semua: [] };
  // rekap per bulan supaya siswa tahu bulan mana kehadirannya turun
  const perBulan = {};
  (r.absen || []).forEach((a) => {
    const b = String(a.date || '').slice(0, 7);
    if (!/^\d{4}-\d{2}$/.test(b)) return;
    perBulan[b] = perBulan[b] || { n: 0, hadir: 0 };
    perBulan[b].n++;
    if (a.status === 'Hadir') perBulan[b].hadir++;
  });
  const bulanList = Object.keys(perBulan).sort().reverse();
  return `
    <div class="card"><h2>Absen hari ini</h2>
      <p class="mini">${fmtFull(today)}</p>
      ${ab ? `<div class="note ok">Sudah absen hari ini: <b>${esc(ab.status)}</b>${ab.at ? ` — pukul ${esc(String(ab.at).slice(11, 16))}` : ''}.<br><span class="mini">Masih bisa diubah bila keliru.</span></div>` : ''}
      <div class="abs-row">${ABSEN.map(([k, cl]) => `<button class="ab ${cl} ${ab && ab.status === k ? 'on' : ''}" data-abs="${k}">${k}</button>`).join('')}</div>
    </div>

    <div class="card"><h2>Rekap kehadiranku</h2>
      <div class="sum">
        <div><small>Hadir</small><b class="pos">${c.Hadir}</b></div>
        <div><small>Izin</small><b>${c.Izin}</b></div>
        <div><small>Sakit</small><b>${c.Sakit}</b></div>
        <div><small>Alpa</small><b class="${c.Alpa ? 'neg' : ''}">${c.Alpa}</b></div>
      </div>
      <div class="sum mt">
        <div><small>Hari tercatat</small><b>${rk.pertemuan || 0}</b></div>
        <div><small>Kehadiran</small><b>${rk.persen == null ? '—' : rk.persen + '%'}</b></div>
        <div><small>Pelajaran berlangsung</small><b>${rk.pelajaran || 0}</b></div>
        <div><small>Kamu hadir</small><b>${rk.hadirDiPelajaran || 0}</b></div>
      </div>
      ${bulanList.length ? `<h3>Per bulan</h3>
        <ul class="list">${bulanList.map((b) => {
          const x = perBulan[b];
          return `<li><div class="grow"><div class="t">${fmtBulan(b)}</div>
            <div class="s">${x.hadir} hadir dari ${x.n} hari tercatat</div></div>
            <span class="badge ${x.hadir === x.n ? 'ok' : (x.hadir / x.n >= 0.8 ? '' : 'warn')}">${Math.round(x.hadir / x.n * 100)}%</span></li>`;
        }).join('')}</ul>` : ''}
      <h3>Riwayat absen</h3>
      ${(r.absen || []).length ? `<div class="hist">${(r.absen || []).slice(0, 60).map((a) => `<span class="h ${String(a.status).toLowerCase()}" title="${fmtFull(a.date)} — ${esc(a.status)}">${fmtShort(a.date)}</span>`).join('')}</div>`
      : '<p class="mini">Belum ada catatan absen.</p>'}
      ${(tp.diikuti || []).length ? `<h3>TP yang sudah kamu ikuti</h3><div class="tps">${tp.diikuti.map((x) => `<span class="badge b1">${esc(x)}</span>`).join(' ')}</div>` : ''}
    </div>`;
}

/* --- 3. TUGAS ------------------------------------------------------- */

function paneTugas(r) {
  const open = tugasBelum(r);
  const telat = open.filter((t) => t.sisa !== null && t.sisa < 0);
  const sudah = (r.tugas || []).filter((t) => t.submitted);
  const dinilai = sudah.filter((t) => t.score !== '' && t.score != null);
  return `
    ${telat.length ? `<div class="note err"><b>${telat.length} tugas sudah lewat batas</b> dan belum kamu kumpulkan.</div>` : ''}
    <div class="card"><h2>Ringkasan tugas</h2>
      <div class="sum">
        <div><small>Semua tugas</small><b>${(r.tugas || []).length}</b></div>
        <div><small>Terkumpul</small><b class="pos">${sudah.length}</b></div>
        <div><small>Sudah dinilai</small><b>${dinilai.length}</b></div>
        <div><small>Belum</small><b class="${open.length ? 'neg' : ''}">${open.length}</b></div>
      </div>
    </div>
    <div class="card"><h2>Belum dikerjakan <span class="badge ${open.length ? 'danger' : 'ok'}">${open.length}</span></h2>
      ${open.length ? open.map((t) => taskCard(t)).join('') : '<div class="empty">Semua tugas sudah dikumpulkan</div>'}</div>
    <div class="card"><h2>Sudah dikumpulkan <span class="badge">${sudah.length}</span></h2>
      ${sudah.length ? `<ul class="list">${sudah.map((t) => `<li>
          <div class="grow"><div class="t">${esc(t.title)}${t.groupName ? ` <span class="badge grp">${esc(t.groupName)}</span>` : ''}</div>
            <div class="s">${esc([t.submittedAt ? 'dikumpulkan ' + fmtDate(String(t.submittedAt).slice(0, 10)) : '', t.late ? 'terlambat' : '', t.members ? 'bersama ' + t.members : '', t.feedback ? 'catatan guru: ' + t.feedback : ''].filter(Boolean).join(' · '))}</div></div>
          ${(t.score !== '' && t.score != null) ? `<span class="badge ok">${esc(String(t.score))}${Number(t.maxScore) && Number(t.maxScore) !== 100 ? '/' + esc(String(t.maxScore)) : ''}${t.letter ? ' · ' + esc(t.letter) : ''}</span>` : '<span class="badge">menunggu nilai</span>'}</li>`).join('')}</ul>`
      : '<p class="mini">Belum ada tugas yang kamu kumpulkan.</p>'}</div>`;
}

function taskCard(t) {
  const grup = String(t.mode || '') === 'kelompok';
  const dipilih = S_TAB.pick[t.id] || [];
  const teman = (S.names || []).filter((n) => n.toLowerCase() !== String(S.name).toLowerCase());
  const ket = t.sisa === null ? '' : (t.sisa < 0 ? `lewat ${-t.sisa} hari` : (t.sisa === 0 ? 'hari ini' : `${t.sisa} hari lagi`));
  return `<div class="task">
    <div class="t">${esc(t.title)}${grup ? ' <span class="badge grp">Tugas kelompok</span>' : ''}
      ${ket ? `<span class="badge ${t.sisa < 0 ? 'danger' : (t.sisa <= 3 ? 'warn' : '')}">${esc(ket)}</span>` : ''}</div>
    <div class="s">${esc([t.subject, t.type, t.tpCode ? 'TP ' + t.tpCode : ''].filter(Boolean).join(' · '))}${t.dueDate ? ` · batas ${fmtDate(t.dueDate)}` : ''}${Number(t.maxScore) ? ` · nilai maksimal ${esc(String(t.maxScore))}` : ''}</div>
    ${t.instruction ? `<p class="mini" style="white-space:pre-wrap">${esc(t.instruction)}</p>` : ''}
    ${t.link ? `<div class="lk-chips"><a class="lk-chip" href="${esc(t.link)}" target="_blank" rel="noopener">Bahan tugas</a></div>` : ''}
    ${grup ? `<div class="grp-box">
        <label>Anggota kelompok <span class="mini">(namamu sudah otomatis ikut)</span></label>
        ${t.groupMin || t.groupMax ? `<p class="mini">Anggota ${t.groupMin ? 'minimal ' + t.groupMin : ''}${t.groupMin && t.groupMax ? ', ' : ''}${t.groupMax ? 'maksimal ' + t.groupMax : ''} orang (termasuk kamu).</p>` : ''}
        <input class="input gname" data-task="${esc(t.id)}" placeholder="Nama kelompok (opsional)">
        <div class="mem mt">${teman.map((n) => `<label class="memb ${dipilih.includes(n) ? 'on' : ''}">
          <input type="checkbox" value="${esc(n)}" data-mem="${esc(t.id)}" ${dipilih.includes(n) ? 'checked' : ''}> ${esc(n)}</label>`).join('')}</div>
        <p class="mini">Terpilih: <b data-count="${esc(t.id)}">${dipilih.length + 1}</b> orang. Satu nilai berlaku untuk seluruh anggota.</p>
      </div>` : ''}
    <label>Tautan pekerjaan (Drive/Docs) — opsional</label>
    <input class="input lnk" data-task="${esc(t.id)}" placeholder="https://…">
    <label>Jawaban / keterangan</label>
    <textarea class="input txt" data-task="${esc(t.id)}" rows="3" placeholder="Tulis jawaban atau keterangan singkat"></textarea>
    <button class="btn primary mt" data-send="${esc(t.id)}">Kumpulkan${grup ? ' untuk kelompok' : ''}</button>
  </div>`;
}

/* --- 4. NILAI ------------------------------------------------------- */

function paneNilai(r) {
  const rp = rpAktif();
  const nilai = r.nilai || [];
  const luar = nilai.filter((n) => n.luar).length;
  const SUM = { daftarnilai: 'Daftar nilai', scorelist: 'Score List', tugas: 'Tugas', excel: 'Unggahan guru', ledger: 'Ledger', beku: 'Arsip' };
  // kelompokkan per jenis penilaian supaya mudah dibaca
  const grup = {};
  nilai.forEach((n) => {
    const k = n.assessType || 'Lainnya';
    grup[k] = grup[k] || [];
    grup[k].push(n);
  });
  const jenisUrut = Object.keys(grup).sort();
  return `
    ${rp ? kartuRapor(rp, r, false) : `<div class="card"><h2>Nilai</h2>
      <div class="empty">Belum ada nilai unit, Mid Test, atau Final Test untuk kelas ini.</div></div>`}

    ${luar ? `<div class="note warn">${luar} nilai tercatat di luar rentang 0–100 dan sudah dibatasi supaya hitungannya tetap masuk akal.
      Kalau terasa keliru, tanyakan ke gurumu.</div>` : ''}

    <div class="card"><h2>Seluruh nilaiku <span class="badge">${nilai.length}</span></h2>
      ${nilai.length ? jenisUrut.map((k) => `<h3>${esc(k)} <span class="badge">${grup[k].length}</span></h3>
        <div class="nilai">${grup[k].map((n) => `<div class="nrow">
          <div class="grow"><div class="t">${esc(n.title || n.component || 'Penilaian')}</div>
            <div class="s">${esc([n.component, n.tpCode ? 'TP ' + n.tpCode : '', n.date ? fmtDate(n.date) : ''].filter(Boolean).join(' · '))}
              <span class="badge">${esc(SUM[n.source] || n.source || '')}</span>${n.luar ? '<span class="badge warn">di luar rentang</span>' : ''}</div></div>
          <div class="nval"><b>${esc(String(n.scale100))}</b><span class="lt ${lclass(gradeLLC(n.scale100))}">${esc(gradeLLC(n.scale100))}</span>
            ${Number(n.maxScore) !== 100 ? `<i>${esc(String(n.score))}/${esc(String(n.maxScore))}</i>` : ''}</div></div>`).join('')}</div>`).join('')
      : '<div class="empty">Nilaimu akan muncul di sini begitu guru memasukkannya.</div>'}</div>`;
}

/* --- 5. MATERI & TP ------------------------------------------------- */

function paneBelajar(r) {
  const list = (r.pelajaran || []).slice().sort((a, b) => {
    const pa = (a.status === 'Terlaksana' || a.lewat) ? 0 : 1;
    const pb = (b.status === 'Terlaksana' || b.lewat) ? 0 : 1;
    return pa - pb || String(b.date).localeCompare(String(a.date));
  });
  const tpr = r.tpRinci || [];
  const ikut = tpr.filter((t) => t.diikuti).length;
  const ajar = tpr.filter((t) => t.diajarkan).length;
  // yang sudah diajarkan ditaruh di depan; sisanya dilipat supaya halaman tidak
  // jadi dinding teks — daftar TP satu semester bisa puluhan baris
  const sudah = tpr.filter((t) => t.diajarkan);
  const nanti = tpr.filter((t) => !t.diajarkan);
  const barisTP = (t) => `<div class="tpr ${t.diikuti ? 'ikut' : (t.diajarkan ? 'ajar' : '')}">
    <div class="st">${t.diikuti ? '✓' : (t.diajarkan ? '!' : '')}</div>
    <div class="grow"><div class="k">${esc(t.code)}${t.unit ? ` <span class="u">· ${esc(t.unit)}</span>` : ''}</div>
      ${t.objective ? `<div class="o">${esc(t.objective)}</div>` : ''}
      ${t.skill || t.detail ? `<div class="u">${esc([t.skill, t.detail].filter(Boolean).join(' — '))}</div>` : ''}</div></div>`;
  return `
    ${tpr.length ? `<div class="card"><h2>Tujuan pembelajaran <span class="badge">${ikut}/${tpr.length}</span></h2>
      <p class="mini">Centang hijau berarti kamu hadir saat TP itu diajarkan. Kuning berarti sudah diajarkan,
        tetapi kamu tidak tercatat hadir — sebaiknya kejar materinya.</p>
      <div class="sum mt">
        <div><small>Sudah diajarkan</small><b>${ajar}</b></div>
        <div><small>Kamu ikuti</small><b class="pos">${ikut}</b></div>
        <div><small>Terlewat</small><b class="${ajar - ikut ? 'neg' : ''}">${ajar - ikut}</b></div>
        <div><small>Belum diajarkan</small><b>${tpr.length - ajar}</b></div>
      </div>
      ${sudah.length ? `<div class="tp-list mt">${sudah.map(barisTP).join('')}</div>`
        : '<div class="empty mt">Belum ada TP yang diajarkan di kelas ini.</div>'}
      ${nanti.length ? `<details class="lipat"><summary>Belum diajarkan — ${nanti.length} TP</summary>
        <div class="tp-list mt">${nanti.map(barisTP).join('')}</div></details>` : ''}
    </div>` : ''}

    <div class="card"><h2>Pembelajaran yang sudah berlangsung
        <span class="badge">${list.filter((m) => m.status === 'Terlaksana').length}</span></h2>
      <p class="mini">Materi, slide, dan catatan tiap pertemuan — beserta kehadiranmu hari itu.</p>
      ${list.length ? list.slice(0, 40).map((m) => {
        const a = m.hadir ? `<span class="h ${String(m.hadir).toLowerCase()}">${esc(m.hadir)}</span>`
          : (m.status === 'Terlaksana' && m.lewat ? '<span class="h x">tidak tercatat</span>' : '');
        return `<div class="les ${m.status === 'Terlaksana' ? '' : 'soon'}">
          <div class="les-h"><b>Pertemuan ${esc(String(m.no || '—'))}</b><span class="mini">${fmtFull(m.date)}${m.start ? ' · ' + esc(m.start) + (m.end ? '–' + esc(m.end) : '') : ''}</span>
            ${m.status === 'Terlaksana' ? a : `<span class="badge">${esc(m.status)}</span>`}</div>
          ${m.tpCodes ? `<div class="tps">${String(m.tpCodes).split(',').map((c) => `<span class="badge b1">${esc(c.trim())}</span>`).join(' ')}</div>` : ''}
          ${m.topic ? `<div class="les-t">${esc(m.topic)}</div>` : ''}
          ${m.material ? `<div class="les-m">${esc(m.material)}</div>` : ''}
          ${(m.links || []).length ? `<div class="lk-chips">${m.links.map((l) => `<a class="lk-chip" href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t || 'Buka materi')}</a>`).join('')}</div>` : ''}
          ${m.taskTitle ? `<div class="mini">Penugasan: ${esc(m.taskTitle)}</div>` : ''}
        </div>`;
      }).join('') : '<div class="empty">Belum ada pembelajaran tercatat</div>'}
    </div>`;
}

/* ---------------------------- interaksi ---------------------------- */

document.addEventListener('click', async (e) => {
  const tb = e.target.closest('[data-tab]');
  if (tb) { S_TAB.cur = tb.dataset.tab; home(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }

  const mp = e.target.closest('[data-mapel]');
  if (mp) { S_TAB.mapel = Number(mp.dataset.mapel) || 0; return home(); }

  const mem = e.target.closest('[data-mem]');
  if (mem) {
    const id = mem.dataset.mem;
    const list = S_TAB.pick[id] || (S_TAB.pick[id] = []);
    const i = list.indexOf(mem.value);
    if (mem.checked) { if (i < 0) list.push(mem.value); } else if (i >= 0) list.splice(i, 1);
    mem.closest('.memb').classList.toggle('on', mem.checked);
    const c = document.querySelector(`[data-count="${id}"]`);
    if (c) c.textContent = String(list.length + 1);
    return;
  }

  const cls = e.target.closest('[data-cls]');
  if (cls) return openClass(cls.dataset.cls, '');
  const nm = e.target.closest('[data-name]');
  if (nm) return openName(nm.dataset.name);
  const bk = e.target.closest('[data-back]');
  if (bk) { S.q = ''; return bk.dataset.back === 'cls' ? pickClass() : pickName(''); }

  const ab = e.target.closest('[data-abs]');
  if (ab) {
    document.querySelectorAll('[data-abs]').forEach((x) => { x.disabled = true; });
    try {
      const j = await call('studentAbsen', { className: S.cls, studentName: S.name, status: ab.dataset.abs });
      toast(j.updated ? `Absen diperbarui: ${ab.dataset.abs}.` : `Absen tercatat: ${ab.dataset.abs}. Terima kasih!`, 'ok');
      await reload();
    } catch (err) {
      toast(err.message, 'err', 7000);
      document.querySelectorAll('[data-abs]').forEach((x) => { x.disabled = false; });
    }
    return;
  }

  const send = e.target.closest('[data-send]');
  if (send) {
    const id = send.dataset.send;
    const link = ($(`.lnk[data-task="${id}"]`) || {}).value || '';
    const text = ($(`.txt[data-task="${id}"]`) || {}).value || '';
    if (!String(text).trim() && !String(link).trim()) return toast('Isi jawaban atau tautan pekerjaanmu dulu.', 'err');
    const members = S_TAB.pick[id] || [];
    const groupName = ($(`.gname[data-task="${id}"]`) || {}).value || '';
    const task = (S.tasks || []).filter((t) => t.id === id)[0] || {};
    if (String(task.mode || '') === 'kelompok') {
      const n = members.length + 1;
      const mn = Number(task.groupMin) || 0, mx = Number(task.groupMax) || 0;
      if (mn && n < mn) return toast(`Kelompok harus berisi minimal ${mn} orang — baru ${n}.`, 'err', 6000);
      if (mx && n > mx) return toast(`Kelompok paling banyak ${mx} orang — sekarang ${n}.`, 'err', 6000);
    }
    const label = send.textContent;
    send.disabled = true; send.textContent = 'Mengirim…';
    try {
      const j = await call('studentSubmit', { taskId: id, studentName: S.name, link, content: text, members, groupName });
      const lepas = (j.released || []);
      toast(j.group ? `Tugas terkumpul untuk ${j.members.length} anggota kelompok. Terima kasih!` : 'Tugas terkumpul. Terima kasih!', 'ok', 6000);
      // bila kelompok dibetulkan, beri tahu siapa yang dikeluarkan supaya tidak ada salah paham
      if (lepas.length) setTimeout(() => toast(`Dikeluarkan dari kelompok: ${lepas.join(', ')}. Mereka perlu mengumpulkan sendiri.`, 'warn', 9000), 6200);
      delete S_TAB.pick[id];
      await reload();
    } catch (err) { toast(err.message, 'err', 7000); send.disabled = false; send.textContent = label; }
  }
});

boot();
</script>
</body>
</html>
